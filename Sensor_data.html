<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooking Oil Quality Dashboard</title>
  
  
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cooking Oil Quality Detection</h1>
  </header>

  <!-- Sensor Value Cards -->
  <section class="cards">
    <div class="card">
      <h3>pH Value</h3>
      <p id="ph">Loading...</p>
    </div>
    <div class="card">
      <h3>Turbidity</h3>
      <p id="turbidity">Loading...</p>
    </div>
    <div class="card">
      <h3>Color</h3>
      <p id="color">Loading...</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
