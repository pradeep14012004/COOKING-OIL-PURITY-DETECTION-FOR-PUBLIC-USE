name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ml_app/requirements.txt
      - run: python -m py_compile ml_app/app.py
